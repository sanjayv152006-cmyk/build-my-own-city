<!doctype html>
<html lang="en" class="bg-slate-950" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz to Build — Smart City Adventure</title>
    <meta name="description" content="An interactive 3D educational city-building game where players solve quizzes to expand a thriving smart metropolis." />
    <meta property="og:title" content="Quiz to Build — Smart City Adventure" />
    <meta property="og:description" content="An interactive 3D educational city-building game where players solve quizzes to expand a thriving smart metropolis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#020617" />
    <link rel="stylesheet" crossorigin href="./assets/index.css" />
  </head>
  <body class="bg-slate-950 text-white overflow-hidden m-0 p-0" style="background-color: #020617;">
    <div id="root"></div>

    <!-- Vite development entry point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Local Launch Guide & VS Code Live Server Fallback:
         1. If opened directly via file:// in Chrome, browser security blocks ES modules; display friendly setup steps.
         2. If opened via static web server (VS Code Live Server on port 5500, etc.), auto-load compiled production bundle. -->
    <script>
      if (window.location.protocol === 'file:') {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: white; font-family: system-ui, -apple-system, sans-serif; padding: 20px; box-sizing: border-box; text-align: center;"><div style="max-width: 540px; background: #0f172a; border: 1px solid #334155; border-radius: 24px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);"><div style="font-size: 48px; margin-bottom: 12px;">🏙️</div><h1 style="font-size: 24px; font-weight: 900; margin: 0 0 8px 0; color: #38bdf8;">Quiz to Build — Smart City Adventure</h1><p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0 0 20px 0;">Modern 3D web applications require a local web server because Chrome security blocks JavaScript modules when opened via direct <code style="background: #1e293b; padding: 2px 6px; border-radius: 6px; color: #fbbf24;">file:///</code> URLs.</p><div style="background: #020617; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; text-align: left; font-size: 13px; margin-bottom: 20px;"><div style="color: #4ade80; font-weight: bold; margin-bottom: 6px;">How to start the game on your computer:</div><div style="color: #cbd5e1; margin-bottom: 4px;">1. Open terminal / command prompt in this project folder.</div><div style="color: #cbd5e1; margin-bottom: 4px;">2. Run:</div><div style="background: #1e293b; color: #38bdf8; font-family: monospace; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px;">npm install && npm run dev</div><div style="color: #cbd5e1;">3. Open <span style="color: #fbbf24;">http://localhost:3000</span> in Chrome!</div></div><div style="font-size: 12px; color: #64748b;">Or in VS Code: Right-click <strong>index.html</strong> &gt; <strong>Open with Live Server</strong>.</div></div></div>';
        }
      } else if (window.location.port !== '3000' && !window.location.hostname.includes('run.app')) {
        if (!window.__GAME_INITIALIZED__) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          document.body.appendChild(s);
        }
      }
    </script>
  </body>
</html>
